name: Inspect the Spotify page

# Diagnostic, à lancer à la main (Actions → Run workflow) ou en poussant ce
# fichier. Il répond à une question qui décide de la mise en page de
# l'application : que sert open.spotify.com à un agent de bureau ?
#
#   • une page avec ou sans <meta name="viewport"> — c'est ce qui décide si la
#     WebView met la page en page sur la largeur du téléphone ou sur 980 px ;
#   • la présence des repères que l'interface d'origine habille
#     (`Desktop_LeftSidebar_Id`, `now-playing-bar`, `global-nav-bar`…).
#
# Sans réponse à ça, on règle l'affichage en aveugle.
#
# Les constats sont publiés en annotations (`::notice` / `::warning`) : c'est
# ce qui reste lisible depuis les outils qui n'ont pas accès aux journaux.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-page.yml"

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the page as the app does
        run: |
          set +e -uo pipefail   # GitHub lance les étapes en « -e » : un grep sans résultat tuait le diagnostic
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          curl -sSL -o /tmp/desktop.html -w "code=%{http_code} final=%{url_effective}\n" -A "$UA" \
            -H "accept-language: fr-FR,fr;q=0.9" "https://open.spotify.com/" || true
          SIZE=$(wc -c < /tmp/desktop.html 2>/dev/null || echo 0)

          VP=$(grep -o '<meta[^>]*viewport[^>]*>' /tmp/desktop.html 2>/dev/null | head -3 | tr '\n' ' ')
          [ -z "$VP" ] && [ ! -s /tmp/desktop.html ] && { echo "::error title=Bureau : page vide::curl n'a rien reçu de open.spotify.com depuis un runner GitHub"; }
          if [ -z "$VP" ]; then
            echo "::warning title=Bureau : aucune balise viewport::aucun <meta viewport> — la WebView mettrait la page en page sur 980 px ($SIZE octets reçus)"
          else
            echo "::notice title=Bureau : balise viewport::$VP"
          fi

          for marker in Desktop_LeftSidebar_Id now-playing-bar global-nav-bar \
                        Desktop_PanelContainer_Id grid-container tracklist-row; do
            N=$(grep -o "$marker" /tmp/desktop.html | wc -l)
            echo "::notice title=$marker::occurrences dans la page bureau : $N"
          done

          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/desktop.html | head -1)
          echo "::notice title=Titre bureau::${TITLE:-aucun} ($SIZE octets)"

      - name: Compare with a phone user agent
        run: |
          set +e -uo pipefail   # GitHub lance les étapes en « -e » : un grep sans résultat tuait le diagnostic
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Mobile Safari/537.36"
          curl -sSL -o /tmp/mobile.html -w "code=%{http_code} final=%{url_effective}\n" -A "$UA" "https://open.spotify.com/" || true
          SIZE=$(wc -c < /tmp/mobile.html 2>/dev/null || echo 0)
          VP=$(grep -o '<meta[^>]*viewport[^>]*>' /tmp/mobile.html | head -3 | tr '\n' ' ')
          if [ -z "$VP" ]; then
            echo "::warning title=Mobile : aucune balise viewport::aucun <meta viewport> ($SIZE octets reçus)"
          else
            echo "::notice title=Mobile : balise viewport::$VP"
          fi
          N=$(grep -o "Desktop_LeftSidebar_Id" /tmp/mobile.html | wc -l)
          echo "::notice title=Mobile : repères bureau::Desktop_LeftSidebar_Id × $N ($SIZE octets)"

      - name: The page head, verbatim
        run: |
          set +e -uo pipefail   # GitHub lance les étapes en « -e » : un grep sans résultat tuait le diagnostic
          HEAD=$(head -c 600 /tmp/desktop.html | tr -d '\n' | tr -d '\r')
          echo "::notice title=Début du document bureau::$HEAD"
